#      kafka:
#        condition: service_healthy
#    networks:
#      - loyalty-network
#    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  flink_jobmanager_data:
  flink_savepoints:
  flink_taskmanager_data:

networks:
  loyalty-network:
    driver: bridge

